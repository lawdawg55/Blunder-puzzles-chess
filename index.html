<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>My Blunder Puzzles</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      max-width: 720px;
      margin: 0 auto;
      padding: 1rem;
      background: #1a1a1a;
      color: #eee;
      -webkit-tap-highlight-color: transparent;
    }
    h1 { font-size: 1.4rem; margin-bottom: 0.3rem; }
    label { display: block; margin-top: 0.8rem; font-size: 0.9rem; color: #94a3b8; }
    textarea, input, button, select {
      font-size: 16px;
      padding: 0.6rem;
      margin: 0.3rem 0;
      border-radius: 8px;
      border: 1px solid #444;
      background: #2a2a2a;
      color: #fff;
      width: 100%;
      box-sizing: border-box;
    }
    button {
      background: #3b82f6;
      border: none;
      cursor: pointer;
      margin-top: 0.5rem;
    }
    button:disabled { opacity: 0.5; }
    button.secondary { background: #475569; }
    button.test { background: #059669; }

    #board {
      width: 100%;
      max-width: 400px;
      margin: 1rem auto;
      aspect-ratio: 1;
      display: grid;
      grid-template-columns: repeat(8, 1fr);
      grid-template-rows: repeat(8, 1fr);
      border: 3px solid #444;
      border-radius: 4px;
      overflow: hidden;
      user-select: none;
      touch-action: manipulation;
    }
    .square {
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: clamp(1.6rem, 8vw, 2.4rem);
      position: relative;
      cursor: pointer;
    }
    .light { background: #eeeed2; }
    .dark  { background: #769656; }
    .selected {
      box-shadow: inset 0 0 0 4px #3b82f6;
      background: #93c5fd !important;
    }
    .legal-hint::after {
      content: '';
      width: 28%;
      height: 28%;
      border-radius: 50%;
      background: rgba(0,0,0,0.25);
      position: absolute;
    }
    .capture-hint {
      box-shadow: inset 0 0 0 4px rgba(0,0,0,0.35);
    }

    .puzzle-card {
      background: #2a2a2a;
      padding: 1rem;
      border-radius: 12px;
      margin: 1rem 0;
    }
    .status { color: #94a3b8; font-size: 0.9rem; }
    .feedback {
      font-weight: 600;
      margin-top: 0.6rem;
      min-height: 1.4em;
    }
    .feedback.correct { color: #4ade80; }
    .feedback.wrong   { color: #f87171; }
    .solution { color: #4ade80; font-weight: bold; margin-top: 0.4rem; }
    .error-box {
      background: #7f1d1d;
      color: #fecaca;
      padding: 0.8rem;
      border-radius: 8px;
      margin: 0.8rem 0;
      font-size: 0.9rem;
      display: none;
    }
    .chesscom-only { display: none; }
  </style>
</head>
<body>
  <h1>♟ My Blunder Puzzles</h1>
  <p class="status">Puzzles from your own mistakes on Lichess & Chess.com</p>

  <label>Platform</label>
  <select id="platform">
    <option value="lichess">Lichess</option>
    <option value="chesscom">Chess.com</option>
  </select>

  <label>Username</label>
  <input id="username" placeholder="your username" autocomplete="off" />

  <div class="chesscom-only" id="chesscomFields">
    <label>Your Cloudflare Worker URL</label>
    <input id="workerUrl" placeholder="https://chesscom-proxy.your-subdomain.workers.dev" />

    <label>Months to fetch</label>
    <select id="months">
      <option value="1">Last 1 month</option>
      <option value="2">Last 2 months</option>
      <option value="3" selected>Last 3 months</option>
      <option value="4">Last 4 months</option>
      <option value="5">Last 5 months</option>
      <option value="6">Last 6 months</option>
    </select>
  </div>

  <label>Or paste PGN(s) here</label>
  <textarea id="pgnInput" rows="4" placeholder="Paste one or more games in PGN format…"></textarea>

  <button id="analyzeBtn">Find Blunders & Make Puzzles</button>
  <button id="testBtn" class="test">Test with Sample Game</button>

  <p id="progress" class="status"></p>
  <div id="errorBox" class="error-box"></div>

  <div id="puzzleArea" style="display:none">
    <div class="puzzle-card">
      <div id="puzzleInfo"></div>
      <div id="board"></div>
      <div id="feedback" class="feedback"></div>
      <button id="showSolution" class="secondary">Show Solution</button>
      <button id="resetPuzzle" class="secondary">Reset Position</button>
      <button id="nextPuzzle">Next Puzzle</button>
      <p id="solutionText" class="solution"></p>
    </div>
  </div>

  <script>
    let puzzles = [];
    let currentPuzzleIndex = 0;
    let stockfish = null;
    let analyzing = false;

    let game = null;
    let selectedSquare = null;
    let legalMoves = [];
    let originalFen = null;
    let solved = false;

    // Sample game that contains clear mistakes
    const SAMPLE_PGN = `[Event "Test Game"]
[Site "https://lichess.org"]
[Result "0-1"]
[White "Player1"]
[Black "Player2"]

1. e4 e5 2. Nf3 Nc6 3. Bb5 a6 4. Ba4 Nf6 5. O-O Be7 6. Re1 b5 7. Bb3 d6 8. c3 O-O 9. h3 Nb8 10. d4 Nbd7 11. c4 c6 12. cxb5 axb5 13. Nc3 Bb7 14. Bg5 b4 15. Nb1 h6 16. Bh4 c5 17. dxe5 Nxe4 18. Bxe7 Qxe7 19. exd6 Qf6 20. Nbd2 Nxd6 21. Nc4 Nxc4 22. Bxc4 Nb6 23. Ne5 Rae8 24. Bxf7+ Rxf7 25. Nxf7 Rxe1+ 26. Qxe1 Kxf7 27. Qe3 Qg5 28. Qxg5 hxg5 29. b3 Ke6 30. a3 Kd6 31. axb4 cxb4 32. Ra5 Nd5 33. f3 Bc8 34. Kf2 Bf5 35. Ra7 g6 36. Ra6+ Kc5 37. Ke1 Nf4 38. g3 Nxh3 39. Kd2 Kb5 40. Rd6 Kc5 41. Ra6 Nf2 42. g4 Bd3 43. Re6 0-1`;

    document.getElementById('platform').addEventListener('change', (e) => {
      const isChessCom = e.target.value === 'chesscom';
      document.getElementById('chesscomFields').style.display = isChessCom ? 'block' : 'none';
    });

    const pieceSymbols = {
      'K': '♔', 'Q': '♕', 'R': '♖', 'B': '♗', 'N': '♘', 'P': '♙',
      'k': '♚', 'q': '♛', 'r': '♜', 'b': '♝', 'n': '♞', 'p': '♟'
    };

    function showError(msg) {
      const box = document.getElementById('errorBox');
      box.textContent = msg;
      box.style.display = 'block';
    }

    function hideError() {
      document.getElementById('errorBox').style.display = 'none';
    }

    function renderBoard(fen) {
      const boardEl = document.getElementById('board');
      boardEl.innerHTML = '';
      const temp = new Chess(fen);
      const board = temp.board();

      for (let rank = 0; rank < 8; rank++) {
        for (let file = 0; file < 8; file++) {
          const sq = document.createElement('div');
          const algebraic = String.fromCharCode(97 + file) + (8 - rank);
          sq.className = 'square ' + ((rank + file) % 2 === 0 ? 'light' : 'dark');

          if (selectedSquare === algebraic) sq.classList.add('selected');
          if (legalMoves.includes(algebraic)) {
            const piece = board[rank][file];
            sq.classList.add(piece ? 'capture-hint' : 'legal-hint');
          }

          const piece = board[rank][file];
          if (piece) {
            const key = piece.color === 'w' ? piece.type.toUpperCase() : piece.type.toLowerCase();
            sq.textContent = pieceSymbols[key] || '';
          }

          sq.addEventListener('click', () => onSquareClick(algebraic));
          boardEl.appendChild(sq);
        }
      }
    }

    function onSquareClick(square) {
      if (solved || !game) return;
      const piece = game.get(square);

      if (!selectedSquare) {
        if (piece && piece.color === game.turn()) {
          selectedSquare = square;
          legalMoves = game.moves({ square, verbose: true }).map(m => m.to);
          renderBoard(game.fen());
        }
        return;
      }

      if (selectedSquare === square) {
        selectedSquare = null;
        legalMoves = [];
        renderBoard(game.fen());
        return;
      }

      const move = { from: selectedSquare, to: square, promotion: 'q' };
      const result = game.move(move);

      if (result) {
        selectedSquare = null;
        legalMoves = [];
        renderBoard(game.fen());
        checkIfCorrect(result);
      } else {
        if (piece && piece.color === game.turn()) {
          selectedSquare = square;
          legalMoves = game.moves({ square, verbose: true }).map(m => m.to);
          renderBoard(game.fen());
        } else {
          selectedSquare = null;
          legalMoves = [];
          renderBoard(game.fen());
        }
      }
    }

    function checkIfCorrect(playedMove) {
      const puzzle = puzzles[currentPuzzleIndex];
      const feedback = document.getElementById('feedback');
      const playedUci = playedMove.from + playedMove.to + (playedMove.promotion || '');
      const solutionUci = puzzle.solution;

      if (playedUci === solutionUci || playedUci === solutionUci + 'q') {
        solved = true;
        feedback.textContent = '✓ Correct! Well done.';
        feedback.className = 'feedback correct';
        document.getElementById('solutionText').textContent =
          `Best move: ${puzzle.solution} (you played ${playedMove.san})`;
      } else {
        feedback.textContent = `✗ Wrong. You played ${playedMove.san}. Try again.`;
        feedback.className = 'feedback wrong';
        setTimeout(() => {
          resetToPuzzlePosition();
          feedback.textContent = '';
          feedback.className = 'feedback';
        }, 1100);
      }
    }

    function resetToPuzzlePosition() {
      if (!originalFen) return;
      game = new Chess(originalFen);
      selectedSquare = null;
      legalMoves = [];
      solved = false;
      document.getElementById('feedback').textContent = '';
      document.getElementById('feedback').className = 'feedback';
      document.getElementById('solutionText').textContent = '';
      renderBoard(game.fen());
    }

    // ========== STOCKFISH (same-origin for Safari) ==========
    function initStockfish() {
      return new Promise((resolve, reject) => {
        try {
          // Loads from the same folder as index.html (required for Safari)
          stockfish = new Worker('./stockfish.js');

          let ready = false;

          stockfish.onmessage = (e) => {
            const line = e.data;
            if (typeof line === 'string') {
              if (line === 'uciok') stockfish.postMessage('isready');
              if (line === 'readyok') {
                ready = true;
                resolve();
              }
            }
          };

          stockfish.onerror = (err) => {
            console.error(err);
            reject(new Error('Stockfish failed to load. Make sure stockfish.js is in the same GitHub repo as index.html.'));
          };

          stockfish.postMessage('uci');

          setTimeout(() => {
            if (!ready) {
              reject(new Error('Stockfish timed out. Check that stockfish.js was uploaded correctly.'));
            }
          }, 12000);

        } catch (err) {
          reject(new Error('Could not start engine: ' + err.message));
        }
      });
    }

    function analyzePosition(fen, depth = 10) {
      return new Promise((resolve) => {
        let bestMove = null;
        let score = null;

        const handler = (e) => {
          const line = e.data;
          if (typeof line !== 'string') return;

          if (line.startsWith('info') && line.includes('score')) {
            const scoreMatch = line.match(/score (cp|mate) (-?\d+)/);
            if (scoreMatch) {
              score = scoreMatch[1] === 'cp'
                ? parseInt(scoreMatch[2]) / 100
                : (parseInt(scoreMatch[2]) > 0 ? 100 : -100);
            }
            const pvMatch = line.match(/ pv ([a-h][1-8][a-h][1-8][qrbn]?)/);
            if (pvMatch) bestMove = pvMatch[1];
          }

          if (line.startsWith('bestmove')) {
            stockfish.removeEventListener('message', handler);
            const move = line.split(' ')[1];
            resolve({ bestMove: move || bestMove, score: score ?? 0 });
          }
        };

        stockfish.addEventListener('message', handler);
        stockfish.postMessage('ucinewgame');
        stockfish.postMessage(`position fen ${fen}`);
        stockfish.postMessage(`go depth ${depth}`);
      });
    }

    async function findBlundersInGame(pgn) {
      const chess = new Chess();
      try {
        chess.load_pgn(pgn);
      } catch (e) {
        return [];
      }

      const history = chess.history({ verbose: true });
      if (history.length < 4) return [];

      chess.reset();
      const found = [];
      let prevScore = 0;

      for (let i = 0; i < history.length; i++) {
        const move = history[i];
        const fenBefore = chess.fen();
        chess.move(move);

        const after = await analyzePosition(chess.fen(), 9);
        const afterScore = after.score ?? 0;

        const swing = move.color === 'w'
          ? afterScore - prevScore
          : prevScore - afterScore;

        // Threshold: -0.9 (finds more puzzles)
        if (swing < -0.9) {
          const before = await analyzePosition(fenBefore, 11);
          if (before.bestMove) {
            found.push({
              fen: fenBefore,
              solution: before.bestMove,
              played: move.san,
              swing: swing.toFixed(1),
              moveNumber: Math.floor(i / 2) + 1,
              color: move.color,
              context: `You played ${move.san} (${swing.toFixed(1)})`
            });
          }
        }

        prevScore = afterScore;
        document.getElementById('progress').textContent =
          `Analyzing move ${i + 1} of ${history.length}…`;
      }
      return found;
    }

    async function fetchLichessGames(username, max = 12) {
      const url = `https://lichess.org/api/games/user/${encodeURIComponent(username)}?max=${max}&moves=true`;
      const res = await fetch(url, { headers: { Accept: 'application/x-chess-pgn' } });
      if (!res.ok) throw new Error('Lichess fetch failed: ' + res.status);
      return await res.text();
    }

    async function fetchChessComGames(username, workerBase, months = 3) {
      const archivesRes = await fetch(`${workerBase}?username=${encodeURIComponent(username)}`);
      if (!archivesRes.ok) throw new Error('Failed to get Chess.com archives. Check your Worker URL.');
      const data = await archivesRes.json();
      const archives = data.archives || [];

      if (archives.length === 0) throw new Error('No games found for this Chess.com user.');

      const recent = archives.slice(-months);
      let allPgn = '';

      for (const archiveUrl of recent) {
        const parts = archiveUrl.split('/');
        const year = parts[parts.length - 2];
        const month = parts[parts.length - 1];

        const pgnRes = await fetch(
          `${workerBase}?username=${encodeURIComponent(username)}&year=${year}&month=${month}`
        );
        if (pgnRes.ok) {
          allPgn += await pgnRes.text() + '\n\n';
        }
      }
      return allPgn;
    }

    function splitPgn(pgnText) {
      return pgnText
        .split(/\n\n(?=\[Event)/)
        .map(g => g.trim())
        .filter(g => g.length > 40);
    }

    async function runAnalysis(pgnList) {
      puzzles = [];
      for (let i = 0; i < pgnList.length; i++) {
        document.getElementById('progress').textContent =
          `Game ${i + 1} of ${pgnList.length} – looking for mistakes…`;
        const blunders = await findBlundersInGame(pgnList[i]);
        puzzles.push(...blunders);
      }

      if (puzzles.length === 0) {
        document.getElementById('progress').textContent =
          'No significant mistakes found. Try a different game.';
      } else {
        document.getElementById('progress').textContent = `Found ${puzzles.length} puzzles!`;
        currentPuzzleIndex = 0;
        showCurrentPuzzle();
        document.getElementById('puzzleArea').style.display = 'block';
      }
    }

    document.getElementById('analyzeBtn').onclick = async () => {
      if (analyzing) return;
      analyzing = true;
      document.getElementById('analyzeBtn').disabled = true;
      document.getElementById('testBtn').disabled = true;
      hideError();
      document.getElementById('progress').textContent = 'Starting engine…';

      try {
        await initStockfish();
        document.getElementById('progress').textContent = 'Engine ready. Loading games…';

        let allPgns = [];
        const platform = document.getElementById('platform').value;
        const user = document.getElementById('username').value.trim();
        const pasted = document.getElementById('pgnInput').value.trim();
        const workerUrl = document.getElementById('workerUrl').value.trim().replace(/\/$/, '');
        const months = parseInt(document.getElementById('months').value, 10) || 3;

        if (user) {
          if (platform === 'lichess') {
            const multi = await fetchLichessGames(user);
            allPgns = splitPgn(multi);
          } else {
            if (!workerUrl) throw new Error('Please enter your Cloudflare Worker URL.');
            const multi = await fetchChessComGames(user, workerUrl, months);
            allPgns = splitPgn(multi);
          }
        }

        if (pasted) {
          allPgns = allPgns.concat(splitPgn(pasted));
        }

        if (allPgns.length === 0) {
          throw new Error('No games found. Enter a username or paste a PGN.');
        }

        await runAnalysis(allPgns);

      } catch (err) {
        console.error(err);
        document.getElementById('progress').textContent = '';
        showError(err.message);
      } finally {
        analyzing = false;
        document.getElementById('analyzeBtn').disabled = false;
        document.getElementById('testBtn').disabled = false;
      }
    };

    document.getElementById('testBtn').onclick = async () => {
      if (analyzing) return;
      analyzing = true;
      document.getElementById('analyzeBtn').disabled = true;
      document.getElementById('testBtn').disabled = true;
      hideError();
      document.getElementById('progress').textContent = 'Starting engine for test…';

      try {
        await initStockfish();
        document.getElementById('progress').textContent = 'Analyzing sample game…';
        await runAnalysis([SAMPLE_PGN]);
      } catch (err) {
        console.error(err);
        document.getElementById('progress').textContent = '';
        showError(err.message);
      } finally {
        analyzing = false;
        document.getElementById('analyzeBtn').disabled = false;
        document.getElementById('testBtn').disabled = false;
      }
    };

    function showCurrentPuzzle() {
      const p = puzzles[currentPuzzleIndex];
      if (!p) return;

      originalFen = p.fen;
      game = new Chess(p.fen);
      selectedSquare = null;
      legalMoves = [];
      solved = false;

      document.getElementById('puzzleInfo').innerHTML =
        `<strong>Puzzle ${currentPuzzleIndex + 1} / ${puzzles.length}</strong><br>` +
        `Move ${p.moveNumber} — ${p.color === 'w' ? 'White' : 'Black'} to move<br>` +
        `<span class="status">${p.context}</span>`;

      document.getElementById('feedback').textContent = '';
      document.getElementById('feedback').className = 'feedback';
      document.getElementById('solutionText').textContent = '';
      renderBoard(game.fen());
    }

    document.getElementById('showSolution').onclick = () => {
      const p = puzzles[currentPuzzleIndex];
      if (p) {
        document.getElementById('solutionText').textContent =
          `Best move: ${p.solution}  (you originally played ${p.played})`;
      }
    };

    document.getElementById('resetPuzzle').onclick = () => resetToPuzzlePosition();
    document.getElementById('nextPuzzle').onclick = () => {
      currentPuzzleIndex = (currentPuzzleIndex + 1) % puzzles.length;
      showCurrentPuzzle();
    };
  </script>
</body>
</html>
