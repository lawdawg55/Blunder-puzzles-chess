<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>My Blunder Puzzles</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      max-width: 720px;
      margin: 0 auto;
      padding: 1rem;
      background: #1a1a1a;
      color: #eee;
      -webkit-tap-highlight-color: transparent;
    }
    h1 { font-size: 1.4rem; margin-bottom: 0.3rem; }
    label { display: block; margin-top: 0.8rem; font-size: 0.9rem; color: #94a3b8; }
    textarea, input, button, select {
      font-size: 16px;
      padding: 0.6rem;
      margin: 0.3rem 0;
      border-radius: 8px;
      border: 1px solid #444;
      background: #2a2a2a;
      color: #fff;
      width: 100%;
      box-sizing: border-box;
    }
    button {
      background: #3b82f6;
      border: none;
      cursor: pointer;
      margin-top: 0.5rem;
    }
    button:disabled { opacity: 0.5; }
    button.secondary { background: #475569; }

    #board {
      width: 100%;
      max-width: 400px;
      margin: 1rem auto;
      aspect-ratio: 1;
      display: grid;
      grid-template-columns: repeat(8, 1fr);
      grid-template-rows: repeat(8, 1fr);
      border: 3px solid #444;
      border-radius: 4px;
      overflow: hidden;
      user-select: none;
      touch-action: manipulation;
    }
    .square {
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: clamp(1.6rem, 8vw, 2.4rem);
      position: relative;
      cursor: pointer;
    }
    .light { background: #eeeed2; }
    .dark  { background: #769656; }
    .selected {
      box-shadow: inset 0 0 0 4px #3b82f6;
      background: #93c5fd !important;
    }
    .legal-hint::after {
      content: '';
      width: 28%;
      height: 28%;
      border-radius: 50%;
      background: rgba(0,0,0,0.25);
      position: absolute;
    }
    .capture-hint {
      box-shadow: inset 0 0 0 4px rgba(0,0,0,0.35);
    }

    .puzzle-card {
      background: #2a2a2a;
      padding: 1rem;
      border-radius: 12px;
      margin: 1rem 0;
    }
    .status { color: #94a3b8; font-size: 0.9rem; }
    .feedback {
      font-weight: 600;
      margin-top: 0.6rem;
      min-height: 1.4em;
    }
    .feedback.correct { color: #4ade80; }
    .feedback.wrong   { color: #f87171; }
    .solution { color: #4ade80; font-weight: bold; margin-top: 0.4rem; }
    .error-box {
      background: #7f1d1d;
      color: #fecaca;
      padding: 0.8rem;
      border-radius: 8px;
      margin: 0.8rem 0;
      font-size: 0.9rem;
    }

    .chesscom-only { display: none; }
  </style>
</head>
<body>
  <h1>♟ My Blunder Puzzles</h1>
  <p class="status">Puzzles from your own mistakes on Lichess & Chess.com</p>

  <label>Platform</label>
  <select id="platform">
    <option value="lichess">Lichess</option>
    <option value="chesscom">Chess.com</option>
  </select>

  <label>Username</label>
  <input id="username" placeholder="your username" autocomplete="off" />

  <div class="chesscom-only" id="chesscomFields">
    <label>Your Cloudflare Worker URL</label>
    <input id="workerUrl" placeholder="https://chesscom-proxy.your-subdomain.workers.dev" />

    <label>Months to fetch</label>
    <select id="months">
      <option value="1">Last 1 month</option>
      <option value="2">Last 2 months</option>
      <option value="3" selected>Last 3 months</option>
      <option value="4">Last 4 months</option>
      <option value="5">Last 5 months</option>
      <option value="6">Last 6 months</option>
    </select>
  </div>

  <label>Or paste PGN(s) here (works for both sites)</label>
  <textarea id="pgnInput" rows="4" placeholder="Paste one or more games in PGN format…"></textarea>

  <button id="analyzeBtn">Find Blunders & Make Puzzles</button>
  <p id="progress" class="status"></p>
  <div id="errorBox" class="error-box" style="display:none;"></div>

  <div id="puzzleArea" style="display:none">
    <div class="puzzle-card">
      <div id="puzzleInfo"></div>
      <div id="board"></div>
      <div id="feedback" class="feedback"></div>
      <button id="showSolution" class="secondary">Show Solution</button>
      <button id="resetPuzzle" class="secondary">Reset Position</button>
      <button id="nextPuzzle">Next Puzzle</button>
      <p id="solutionText" class="solution"></p>
    </div>
  </div>

  <script>
    let puzzles = [];
    let currentPuzzleIndex = 0;
    let stockfish = null;
    let analyzing = false;

    let game = null;
    let selectedSquare = null;
    let legalMoves = [];
    let originalFen = null;
    let solved = false;

    // Show/hide Chess.com fields
    document.getElementById('platform').addEventListener('change', (e) => {
      const isChessCom = e.target.value === 'chesscom';
      document.getElementById('chesscomFields').style.display = isChessCom ? 'block' : 'none';
    });

    const pieceSymbols = {
      'K': '♔', 'Q': '♕', 'R': '♖', 'B': '♗', 'N': '♘', 'P': '♙',
      'k': '♚', 'q': '♛', 'r': '♜', 'b': '♝', 'n': '♞', 'p': '♟'
    };

    function showError(msg) {
      const box = document.getElementById('errorBox');
      box.textContent = msg;
      box.style.display = 'block';
    }

    function hideError() {
      document.getElementById('errorBox').style.display = 'none';
    }

    function renderBoard(fen) {
      const boardEl = document.getElementById('board');
      boardEl.innerHTML = '';
      const temp = new Chess(fen);
      const board = temp.board();

      for (let rank = 0; rank < 8; rank++) {
        for (let file = 0; file < 8; file++) {
          const sq = document.createElement('div');
          const algebraic = String.fromCharCode(97 + file) + (8 - rank);
          sq.className = 'square ' + ((rank + file) % 2 === 0 ? 'light' : 'dark');
          sq.dataset.square = algebraic;

          if (selectedSquare === algebraic) sq.classList.add('selected');
          if (legalMoves.includes(algebraic)) {
            const piece = board[rank][file];
            sq.classList.add(piece ? 'capture-hint' : 'legal-hint');
          }

          const piece = board[rank][file];
          if (piece) {
            const key = piece.color === 'w' ? piece.type.toUpperCase() : piece.type.toLowerCase();
            sq.textContent = pieceSymbols[key] || '';
          }

          sq.addEventListener('click', () => onSquareClick(algebraic));
          boardEl.appendChild(sq);
        }
      }
    }

    function onSquareClick(square) {
      if (solved || !game) return;
      const piece = game.get(square);

      if (!selectedSquare) {
        if (piece && piece.color === game.turn()) {
          selectedSquare = square;
          legalMoves = game.moves({ square, verbose: true }).map(m => m.to);
          renderBoard(game.fen());
        }
        return;
      }

      if (selectedSquare === square) {
        selectedSquare = null;
        legalMoves = [];
        renderBoard(game.fen());
        return;
      }

      const move = { from: selectedSquare, to: square, promotion: 'q' };
      const result = game.move(move);

      if (result) {
        selectedSquare = null;
        legalMoves = [];
        renderBoard(game.fen());
        checkIfCorrect(result);
      } else {
        if (piece && piece.color === game.turn()) {
          selectedSquare = square;
          legalMoves = game.moves({ square, verbose: true }).map(m => m.to);
          renderBoard(game.fen());
        } else {
          selectedSquare = null;
          legalMoves = [];
          renderBoard(game.fen());
        }
      }
    }

    function checkIfCorrect(playedMove) {
      const puzzle = puzzles[currentPuzzleIndex];
      const feedback = document.getElementById('feedback');
      const playedUci = playedMove.from + playedMove.to + (playedMove.promotion || '');
      const solutionUci = puzzle.solution;

      if (playedUci === solutionUci || playedUci === solutionUci + 'q') {
        solved = true;
        feedback.textContent = '✓ Correct! Well done.';
        feedback.className = 'feedback correct';
        document.getElementById('solutionText').textContent =
          `Best move: ${puzzle.solution} (you played ${playedMove.san})`;
      } else {
        feedback.textContent = `✗ Wrong. You played ${playedMove.san}. Try again.`;
        feedback.className = 'feedback wrong';
        setTimeout(() => {
          resetToPuzzlePosition();
          feedback.textContent = '';
          feedback.className = 'feedback';
        }, 1200);
      }
    }

    function resetToPuzzlePosition() {
      if (!originalFen) return;
      game = new Chess(originalFen);
      selectedSquare = null;
      legalMoves = [];
      solved = false;
      document.getElementById('feedback').textContent = '';
      document.getElementById('feedback').className = 'feedback';
      document.getElementById('solutionText').textContent = '';
      renderBoard(game.fen());
    }
